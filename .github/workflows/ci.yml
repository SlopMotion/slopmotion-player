name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax-check player
        run: node --check dist/index.js
      - name: Verify pack files
        run: |
          test -f package.json
          test -f index.d.ts
          test -f dist/index.js
          test -f src/install.ts
          npm pack --dry-run --ignore-scripts

  main-from-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only staging → main
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "Not a pull request; skip branch-gate."
            exit 0
          fi
          if [ "${GITHUB_BASE_REF}" != "main" ]; then
            echo "Target is ${GITHUB_BASE_REF}; branch-gate applies to main only."
            exit 0
          fi
          if [ "${GITHUB_HEAD_REF}" != "staging" ]; then
            echo "::error::main only accepts pull requests from staging (got ${GITHUB_HEAD_REF})."
            exit 1
          fi
          echo "staging → main"
