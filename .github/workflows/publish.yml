name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax-check player
        run: node --check dist/index.js
      - name: Verify pack files
        run: npm pack --dry-run --ignore-scripts

  publish:
    needs: check
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a public package.json
        run: node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.private) {
            console.error('package.json still has private: true — flip it when npm Trusted Publishing is configured.');
            process.exit(1);
          }
          const tag = process.env.GITHUB_REF_NAME;
          const expected = 'v' + pkg.version;
          if (tag !== expected) {
            console.error('Tag ' + tag + ' does not match package.json version ' + expected);
            process.exit(1);
          }
        "
      - name: Stage npm publish
        run: npm stage publish --ignore-scripts --access public
        env:
          NPM_CONFIG_PROVENANCE: true
